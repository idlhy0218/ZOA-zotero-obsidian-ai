name: Build ZOA

on:
  push:
    tags: ["v*"]       # v1.0, v1.1 같은 태그를 push할 때 자동 실행
  workflow_dispatch:   # GitHub Actions 탭에서 수동으로 실행 가능

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller google-generativeai pypdf pillow

      - name: Build Windows exe
        run: pyinstaller --clean --onefile --windowed --name "ZOA" --icon="app_icon.ico" --add-data "app_icon.ico;." zoa.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZOA-Windows
          path: dist/ZOA.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller google-generativeai pypdf pillow

      - name: Create macOS ICNS icon
        run: |
          mkdir app_icon.iconset
          sips -z 16 16     image/logo.png --out app_icon.iconset/icon_16x16.png
          sips -z 32 32     image/logo.png --out app_icon.iconset/icon_16x16@2x.png
          sips -z 32 32     image/logo.png --out app_icon.iconset/icon_32x32.png
          sips -z 64 64     image/logo.png --out app_icon.iconset/icon_32x32@2x.png
          sips -z 128 128   image/logo.png --out app_icon.iconset/icon_128x128.png
          sips -z 256 256   image/logo.png --out app_icon.iconset/icon_128x128@2x.png
          sips -z 256 256   image/logo.png --out app_icon.iconset/icon_256x256.png
          sips -z 512 512   image/logo.png --out app_icon.iconset/icon_256x256@2x.png
          sips -z 512 512   image/logo.png --out app_icon.iconset/icon_512x512.png
          sips -z 1024 1024 image/logo.png --out app_icon.iconset/icon_512x512@2x.png
          iconutil -c icns app_icon.iconset

      - name: Build macOS app
        run: pyinstaller --clean --windowed --name "ZOA" --icon="app_icon.icns" --add-data "app_icon.ico:." zoa.py

      - name: Zip macOS app
        run: cd dist && zip -r ZOA-macOS.zip ZOA.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZOA-macOS
          path: dist/ZOA-macOS.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')   # 태그 push 시에만 실행, 수동 실행 시 건너뜀
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ZOA-Windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ZOA-macOS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZOA.exe
            ZOA-macOS.zip
